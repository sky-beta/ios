<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sky</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Noto Sans SC", system-ui, sans-serif; color: #edf6ff; background: #0b1424; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 28px 20px; background: radial-gradient(ellipse at top, #24456f, #0b1424 70%); }
    main { width: min(440px, 100%); padding: 38px 30px 30px; text-align: center; border: 1px solid #ffffff20; border-radius: 28px; background: #101e34d9; box-shadow: 0 24px 70px #00000030; }
    .app-icon { display: block; width: 104px; height: 104px; margin: 0 auto; border-radius: 24px; object-fit: cover; background: #ffffff0a; box-shadow: 0 12px 32px #00000030; }
    .app-icon[hidden] { display: none; }
    h1 { margin: 22px 0 24px; font-size: 36px; font-weight: 700; letter-spacing: -.03em; }
    .app-info { margin: 0; font-size: 14px; line-height: 1.8; }
    .app-info p { margin: 8px 0; }
    .label { margin-right: 12px; color: #91a8c0; }
    .note { margin: 20px 0 26px; color: #b8c9dc; font-size: 13px; line-height: 1.9; text-wrap: pretty; }
    .actions { display: grid; gap: 12px; }
    .button { display: grid; place-items: center; min-height: 52px; padding: 14px 18px; border-radius: 14px; color: white; background: #cf0a2c; text-decoration: none; font-size: 15px; font-weight: 650; transition: background .15s, transform .15s; }
    .button:hover { background: #e0143a; transform: translateY(-1px); }
    .button.hms { background: #79c8ff; color: #081728; }
    .button.hms:hover { background: #9ad6ff; }
    .button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .button[aria-disabled="true"] { opacity: .45; pointer-events: none; }
    @media (max-width: 380px) { main { padding: 30px 22px 24px; } .app-info { font-size: 13px; } .label { margin-right: 8px; } }
  </style>
</head>
<body>
  <main>
    <img class="app-icon" id="huawei-icon" alt="光遇应用图标" width="104" height="104" hidden>
    <h1>Sky</h1>
    <div class="app-info">
      <p><span class="label">版本</span><span id="huawei-version">—</span></p>
      <p><span class="label">更新时间</span><time id="huawei-updated">—</time></p>
    </div>
    <p class="note">说明：非华为手机先安装HMS框架 否则黑屏闪退</p>
    <div class="actions">
      <a class="button" id="huawei-download" aria-disabled="true" tabindex="-1">下载光遇</a>
      <a class="button hms" id="hms-download" aria-disabled="true" tabindex="-1">下载 HMS 框架</a>
    </div>
  </main>
  <script>
    const timeFormat = new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    });

    function validateDownload(value, packageName) {
      const url = new URL(value);
      if (url.protocol !== "https:" || url.username || url.password ||
          !url.hostname.endsWith(".dbankcloud.com") ||
          !url.pathname.split("/").pop().startsWith(packageName + ".") ||
          !url.pathname.endsWith(".apk")) {
        throw new Error("Invalid download URL");
      }
      return url.href;
    }

    async function updateDownloads() {
      try {
        const response = await fetch(`./huawei.json?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const urls = {
          huawei: validateDownload(data.downloads?.huawei, "com.tgc.sky.android.huawei"),
          hms: validateDownload(data.downloads?.hms, "com.huawei.hwid")
        };
        const app = data.apps?.huawei;
        const appTime = new Date(app?.updated_at);
        if (typeof app?.version !== "string" || !Number.isFinite(appTime.getTime())) {
          throw new Error("Invalid Sky metadata");
        }
        document.querySelector("#huawei-version").textContent = app.version.replace(/\s*\(\d+\)\s*$/, "");
        const parts = Object.fromEntries(timeFormat.formatToParts(appTime).map(part => [part.type, part.value]));
        const updated = document.querySelector("#huawei-updated");
        updated.textContent = `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}`;
        updated.dateTime = app.updated_at;
        if (app.icon === "huawei-icon.png" && /^[a-f0-9]{64}$/.test(app.icon_sha256 || "")) {
          const icon = document.querySelector("#huawei-icon");
          icon.src = `./${app.icon}?v=${app.icon_sha256}`;
          icon.hidden = false;
        }
        for (const [key, url] of Object.entries(urls)) {
          const link = document.querySelector(`#${key}-download`);
          link.href = url;
          link.removeAttribute("aria-disabled");
          link.removeAttribute("tabindex");
        }
      } catch (error) {
        console.error(error);
      }
    }

    updateDownloads();
    setInterval(updateDownloads, 300000);
  </script>
</body>
</html>
