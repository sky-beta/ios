name: Clean R2 Multipart Upload

run-name: Clean R2 multipart ${{ inputs.scope }}/${{ inputs.name }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: R2 scope below sky/
        required: true
        type: choice
        options:
          - Beta
          - Sky
          - Xu
          - ios
      name:
        description: Incomplete IPA object name
        required: true
        type: string
      upload_id:
        description: R2 multipart upload ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  abort:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Abort exact incomplete multipart upload
        env:
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
          SCOPE: ${{ inputs.scope }}
          OBJECT_NAME: ${{ inputs.name }}
          UPLOAD_ID: ${{ inputs.upload_id }}
        run: |
          set -euo pipefail
          test -n "$SKY_UPLOAD_TOKEN"
          QUERY="$(python3 - <<'PY'
          import os
          from urllib.parse import urlencode
          print(urlencode({
              "scope": os.environ["SCOPE"],
              "name": os.environ["OBJECT_NAME"],
              "upload_id": os.environ["UPLOAD_ID"],
          }))
          PY
          )"
          RESPONSE="$(curl --fail-with-body --silent --show-error --request POST \
            -H "Authorization: Bearer $SKY_UPLOAD_TOKEN" \
            "https://app.idkwhn.ccwu.cc/api/sky-upload/abort?$QUERY")"
          python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("success") and data.get("aborted")' \
            <<<"$RESPONSE"
          echo "Incomplete multipart upload aborted."
