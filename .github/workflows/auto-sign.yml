name: Sign IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-signing-global
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source IPA from main
        uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: |
            全能签.ipa
          sparse-checkout-cone-mode: false

      - name: Restore zsign cache
        id: zsign-cache
        uses: actions/cache@v5
        with:
          path: .tools/zsign
          key: zsign-${{ runner.os }}-e803f870dc686e6161d00d9b22c425b8acdfacee

      - name: Build zsign
        if: steps.zsign-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make pkg-config libssl-dev
          git clone --filter=blob:none https://github.com/zhlynn/zsign.git "$RUNNER_TEMP/zsign"
          git -C "$RUNNER_TEMP/zsign" checkout --detach e803f870dc686e6161d00d9b22c425b8acdfacee
          make -C "$RUNNER_TEMP/zsign/build/linux" -j"$(nproc)"
          mkdir -p .tools
          install -m 0755 "$RUNNER_TEMP/zsign/bin/zsign" .tools/zsign

      - name: Verify zsign
        run: |
          test -x .tools/zsign
          .tools/zsign --version

      - name: Download certificate from R2 and sign main source
        env:
          CERT_ZIP_URL: ${{ secrets.CERT_ZIP_URL }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "全能签.ipa"
          test -n "$CERT_ZIP_URL"
          test -n "$CERT_PASSWORD"
          mkdir -p "$RUNNER_TEMP/cert" dist
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "$CERT_ZIP_URL" -o "$RUNNER_TEMP/cert.zip"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          source = Path("${{ runner.temp }}/cert.zip")
          target = Path("${{ runner.temp }}/cert")
          wanted = {".p12": "signing.p12", ".mobileprovision": "signing.mobileprovision"}
          with ZipFile(source) as archive:
              for item in archive.infolist():
                  suffix = Path(item.filename).suffix.lower()
                  if suffix in wanted and not (target / wanted[suffix]).exists():
                      (target / wanted[suffix]).write_bytes(archive.read(item))
          for filename in wanted.values():
              path = target / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing {filename} in certificate zip")
          PY
          .tools/zsign \
            -f \
            -k "$RUNNER_TEMP/cert/signing.p12" \
            -p "$CERT_PASSWORD" \
            -m "$RUNNER_TEMP/cert/signing.mobileprovision" \
            -z 6 \
            -o dist/quan.ipa \
            "全能签.ipa"
          test -s dist/quan.ipa

      - name: Overwrite GitHub fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload signed-latest dist/quan.ipa --clobber || {
            gh release create signed-latest \
              --target "$GITHUB_SHA" \
              --title "Latest signed IPA" \
              --notes "Automatically signed by GitHub Actions."
            gh release upload signed-latest dist/quan.ipa --clobber
          }

      - name: Overwrite R2 signed IPA
        id: r2_upload
        continue-on-error: true
        env:
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
          UPLOAD_API: https://app.idkwhn.ccwu.cc/api/sky-upload
        run: |
          set -euo pipefail
          test -n "$SKY_UPLOAD_TOKEN"
          auth="Authorization: Bearer $SKY_UPLOAD_TOKEN"
          query="name=quan.ipa&scope="
          created="$(curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
            -X POST -H "$auth" "$UPLOAD_API/create?$query")"
          upload_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_id"])' <<<"$created")"
          abort() {
            curl --silent --show-error --retry 3 --retry-all-errors -X POST -H "$auth" \
              "$UPLOAD_API/abort?$query&upload_id=$upload_id" >/dev/null || true
          }
          trap abort ERR INT TERM
          part="$(curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
            -X PUT -H "$auth" --data-binary @dist/quan.ipa \
            "$UPLOAD_API/part?$query&upload_id=$upload_id&part_number=1")"
          etag="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["etag"])' <<<"$part")"
          python3 - "$upload_id" "$etag" > "$RUNNER_TEMP/r2-complete.json" <<'PY'
          import json, sys
          print(json.dumps({
              "upload_id": sys.argv[1],
              "name": "quan.ipa",
              "scope": "",
              "parts": [{"partNumber": 1, "etag": sys.argv[2]}],
          }))
          PY
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
            -X POST -H "$auth" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/r2-complete.json" "$UPLOAD_API/complete"
          trap - ERR INT TERM

      - name: Report distribution source
        run: |
          if [[ "${{ steps.r2_upload.outcome }}" == "success" ]]; then
            echo "Signed IPA overwritten in R2; installation will prefer R2." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "R2 upload failed; GitHub Release remains the installation fallback." >> "$GITHUB_STEP_SUMMARY"
          fi
