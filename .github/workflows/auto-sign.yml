name: Sign IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-signing-global
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source IPA from main
        uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: |
            全能签.ipa
          sparse-checkout-cone-mode: false

      - name: Prefer remote IPA, fall back to main repository
        env:
          PRIMARY_IPA_URL: https://sign.drnrt8.cn/sign/sign/IPA/%E5%85%A8%E8%83%BD%E7%AD%BE.ipa
        run: |
          set -euo pipefail
          validate_ipa() {
            python3 - "$1" <<'PY'
          import plistlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              infos = [n for n in archive.namelist() if n.startswith('Payload/') and n.count('/') == 2 and n.endswith('.app/Info.plist')]
              if len(infos) != 1:
                  raise SystemExit('IPA must contain one main app Info.plist')
              info = plistlib.loads(archive.read(infos[0]))
              executable = info.get('CFBundleExecutable')
              if not info.get('CFBundleIdentifier') or not executable:
                  raise SystemExit('IPA metadata is incomplete')
              if infos[0].rsplit('/', 1)[0] + '/' + executable not in archive.namelist():
                  raise SystemExit('IPA executable is missing')
              if archive.testzip() is not None:
                  raise SystemExit('IPA CRC validation failed')
              print('Validated IPA:', info['CFBundleIdentifier'], info.get('CFBundleVersion', ''))
          PY
          }
          if curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 60 --retry 1 --retry-max-time 90 \
            --proto '=https' --proto-redir '=https' \
            -H 'Cache-Control: no-cache' \
            "$PRIMARY_IPA_URL" -o "$RUNNER_TEMP/primary.ipa" \
            && validate_ipa "$RUNNER_TEMP/primary.ipa"; then
            cp "$RUNNER_TEMP/primary.ipa" "全能签.ipa"
            echo "IPA source: primary sign.drnrt8.cn" >> "$GITHUB_STEP_SUMMARY"
            echo "IPA source: primary sign.drnrt8.cn"
          else
            echo "::warning::Primary IPA unavailable or invalid; using main/全能签.ipa"
            validate_ipa "全能签.ipa"
            echo "IPA source: GitHub main/全能签.ipa (fallback)" >> "$GITHUB_STEP_SUMMARY"
          fi
          sha256sum "全能签.ipa"

      - name: Restore zsign cache
        id: zsign-cache
        uses: actions/cache@v5
        with:
          path: .tools/zsign
          key: zsign-${{ runner.os }}-e803f870dc686e6161d00d9b22c425b8acdfacee

      - name: Build zsign
        if: steps.zsign-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make pkg-config libssl-dev
          git clone --filter=blob:none https://github.com/zhlynn/zsign.git "$RUNNER_TEMP/zsign"
          git -C "$RUNNER_TEMP/zsign" checkout --detach e803f870dc686e6161d00d9b22c425b8acdfacee
          make -C "$RUNNER_TEMP/zsign/build/linux" -j"$(nproc)"
          mkdir -p .tools
          install -m 0755 "$RUNNER_TEMP/zsign/bin/zsign" .tools/zsign

      - name: Verify zsign
        run: |
          test -x .tools/zsign
          .tools/zsign --version

      - name: Download certificate from R2 and sign selected source
        env:
          CERT_ZIP_URL: ${{ secrets.CERT_ZIP_URL }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "全能签.ipa"
          test -n "$CERT_ZIP_URL"
          test -n "$CERT_PASSWORD"
          mkdir -p "$RUNNER_TEMP/cert" dist
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "$CERT_ZIP_URL" -o "$RUNNER_TEMP/cert.zip"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          source = Path("${{ runner.temp }}/cert.zip")
          target = Path("${{ runner.temp }}/cert")
          wanted = {".p12": "signing.p12", ".mobileprovision": "signing.mobileprovision"}
          with ZipFile(source) as archive:
              for item in archive.infolist():
                  suffix = Path(item.filename).suffix.lower()
                  if suffix in wanted and not (target / wanted[suffix]).exists():
                      (target / wanted[suffix]).write_bytes(archive.read(item))
          for filename in wanted.values():
              path = target / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing {filename} in certificate zip")
          PY
          .tools/zsign \
            -f \
            -b skyshadan123 \
            -k "$RUNNER_TEMP/cert/signing.p12" \
            -p "$CERT_PASSWORD" \
            -m "$RUNNER_TEMP/cert/signing.mobileprovision" \
            -z 6 \
            -o dist/quan.ipa \
            "全能签.ipa"
          test -s dist/quan.ipa

      - name: Publish R2 and GitHub fallback in parallel
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
          UPLOAD_API: https://app.idkwhn.ccwu.cc/api/sky-upload
        run: |
          set -euo pipefail
          publish_github() {
            gh release upload signed-latest dist/quan.ipa --clobber || {
              gh release create signed-latest \
                --target "$GITHUB_SHA" \
                --title "Latest signed IPA" \
                --notes "Automatically signed by GitHub Actions."
              gh release upload signed-latest dist/quan.ipa --clobber
            }
          }
          publish_r2() {
            test -n "$SKY_UPLOAD_TOKEN"
            curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
              -X PUT -H "Authorization: Bearer $SKY_UPLOAD_TOKEN" \
              --data-binary @dist/quan.ipa \
              "$UPLOAD_API/object?name=quan.ipa&scope="
          }
          publish_github >"$RUNNER_TEMP/github-publish.log" 2>&1 & github_pid=$!
          publish_r2 >"$RUNNER_TEMP/r2-publish.log" 2>&1 & r2_pid=$!
          r2_ok=true
          if ! wait "$r2_pid"; then r2_ok=false; fi
          if ! wait "$github_pid"; then
            cat "$RUNNER_TEMP/github-publish.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/github-publish.log"
          if [[ "$r2_ok" == "true" ]]; then
            cat "$RUNNER_TEMP/r2-publish.log"
            echo "r2_ok=true" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/r2-publish.log" >&2
            echo "r2_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report distribution source
        run: |
          if [[ "${{ steps.publish.outputs.r2_ok }}" == "true" ]]; then
            echo "Signed IPA overwritten in R2; installation will prefer R2." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "R2 upload failed; GitHub Release remains the installation fallback." >> "$GITHUB_STEP_SUMMARY"
          fi
