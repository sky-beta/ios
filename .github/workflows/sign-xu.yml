name: Inject Sky Plugin and Sign IPA

run-name: ${{ inputs.operation == 'cleanup' && 'Clean R2 multipart' || (inputs.operation == 'restore-beta' && 'Restore Sky Beta source' || (inputs.plugin_source == 'none' && 'iOS' || 'Sky')) }} ${{ inputs.operation == 'cleanup' && inputs.cleanup_name || (inputs.plugin_source || 'deb') }} ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Signing, source restoration, or exact multipart cleanup
        required: false
        default: sign
        type: choice
        options:
          - sign
          - restore-beta
          - cleanup
      request_id:
        description: Unique signing request ID
        required: false
        type: string
      plugin_source:
        description: Plugin source to inject
        required: false
        default: deb
        type: choice
        options:
          - deb
          - dylib
          - none
      cleanup_scope:
        description: R2 scope used by cleanup
        required: false
        default: Xu
        type: choice
        options:
          - all
          - root
          - Beta
          - Sky
          - Xu
          - ios
      cleanup_name:
        description: Incomplete IPA object name used by cleanup
        required: false
        type: string
      cleanup_upload_id:
        description: Multipart upload ID used by cleanup
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ inputs.operation == 'cleanup' && format('r2-cleanup-{0}', github.run_id) || 'ipa-signing-global' }}
  cancel-in-progress: false
  queue: max

jobs:
  sign:
    if: inputs.operation == 'sign'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      SOURCE_IPA_URL: ${{ inputs.plugin_source == 'none' && 'https://pub-6f7ffe944e2948a19530df1f8bd6fc9f.r2.dev/sky/ios.ipa' || 'https://pub-6f7ffe944e2948a19530df1f8bd6fc9f.r2.dev/sky/Sky.ipa' }}
      PLUGIN_DEB_URL: https://pub-6f7ffe944e2948a19530df1f8bd6fc9f.r2.dev/sky/Sky.deb
      PLUGIN_DYLIB_URL: https://pub-6f7ffe944e2948a19530df1f8bd6fc9f.r2.dev/sky/Sky.dylib
      UPLOAD_API: https://app.idkwhn.ccwu.cc/api/sky-upload
      R2_PUBLIC_BASE: https://pub-6f7ffe944e2948a19530df1f8bd6fc9f.r2.dev
      R2_SCOPE: ${{ inputs.plugin_source == 'none' && 'ios' || (inputs.plugin_source == 'dylib' && 'Xu' || 'Sky') }}
      GITHUB_ASSET_PREFIX: ${{ inputs.plugin_source == 'none' && 'ios-app' || (inputs.plugin_source == 'dylib' && 'xu' || 'sky') }}

    steps:
      - name: Checkout main installation assets
        uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: |
            sky.plist
            sky.png
            xu.plist
            xu.png
            ios-app.plist
            ios-app.png
          sparse-checkout-cone-mode: false

      - name: Free disk space for the large IPA
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /

      - name: Restore zsign cache
        id: zsign-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sky-zsign/zsign
          key: sky-zsign-${{ runner.os }}-e803f870dc686e6161d00d9b22c425b8acdfacee

      - name: Build zsign
        if: steps.zsign-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make pkg-config libssl-dev
          git clone --filter=blob:none https://github.com/zhlynn/zsign.git "$RUNNER_TEMP/zsign-src"
          git -C "$RUNNER_TEMP/zsign-src" checkout --detach e803f870dc686e6161d00d9b22c425b8acdfacee
          make -C "$RUNNER_TEMP/zsign-src/build/linux" -j"$(nproc)"
          mkdir -p "$HOME/.cache/sky-zsign"
          install -m 0755 "$RUNNER_TEMP/zsign-src/bin/zsign" "$HOME/.cache/sky-zsign/zsign"

      - name: Download IPA certificate and optional plugin
        env:
          CERT_ZIP_URL: ${{ secrets.CERT_ZIP_URL }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERT_ZIP_URL"
          test -n "$CERT_PASSWORD"
          SOURCE_REQUEST_URL="${SOURCE_IPA_URL}?signing_run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --location --retry 5 --retry-all-errors --continue-at - \
            -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
            "$SOURCE_REQUEST_URL" -o "$RUNNER_TEMP/Sky.ipa"
          curl --fail --location --retry 5 --retry-all-errors \
            "$CERT_ZIP_URL" -o "$RUNNER_TEMP/cert.zip"
          test -s "$RUNNER_TEMP/Sky.ipa"

          PLUGIN_PATH=""
          PLUGIN_SOURCE="${{ inputs.plugin_source || 'deb' }}"
          if [[ "$PLUGIN_SOURCE" == "dylib" ]]; then
            DYLIB_REQUEST_URL="${PLUGIN_DYLIB_URL}?signing_run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            if curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
              "$DYLIB_REQUEST_URL" -o "$RUNNER_TEMP/Sky.dylib" \
              && file "$RUNNER_TEMP/Sky.dylib" | grep -q 'Mach-O'; then
              PLUGIN_PATH="$RUNNER_TEMP/Sky.dylib"
              echo "Using Sky.dylib"
            fi
          elif [[ "$PLUGIN_SOURCE" == "deb" ]]; then
            if curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors "$PLUGIN_DEB_URL" -o "$RUNNER_TEMP/Sky.deb"; then
              mkdir -p "$RUNNER_TEMP/deb"
              dpkg-deb -x "$RUNNER_TEMP/Sky.deb" "$RUNNER_TEMP/deb"
              PLUGIN_PATH="$(find "$RUNNER_TEMP/deb" -type f -iname '*.dylib' -print -quit)"
              if [[ -n "$PLUGIN_PATH" ]] && file "$PLUGIN_PATH" | grep -q 'Mach-O'; then
                echo "Using dylib extracted from Sky.deb"
              else
                PLUGIN_PATH=""
              fi
            fi
          elif [[ "$PLUGIN_SOURCE" == "none" ]]; then
            echo "Signing ios.ipa without injection or binary modification"
          else
            echo "Unsupported plugin source: $PLUGIN_SOURCE" >&2
            exit 1
          fi

          if [[ -n "$PLUGIN_PATH" ]]; then
            printf '%s' "$PLUGIN_PATH" > "$RUNNER_TEMP/plugin-path"
          elif [[ "$PLUGIN_SOURCE" == "none" ]]; then
            echo "No plugin requested"
          else
            echo "Requested plugin is unavailable or invalid; signing without injection"
          fi

          mkdir -p "$RUNNER_TEMP/cert"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("${{ runner.temp }}")
          wanted = {".p12": "signing.p12", ".mobileprovision": "signing.mobileprovision"}
          with ZipFile(root / "cert.zip") as archive:
              for item in archive.infolist():
                  suffix = Path(item.filename).suffix.lower()
                  target = root / "cert" / wanted.get(suffix, "")
                  if suffix in wanted and not target.exists():
                      target.write_bytes(archive.read(item))
          for filename in wanted.values():
              path = root / "cert" / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing {filename} in certificate zip")
          PY
          df -h /

      - name: Locate the main executable and build sky.plist
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/Sky.ipa" -d "$RUNNER_TEMP/unpacked"
          python3 - <<'PY'
          import json
          import plistlib
          import re
          from pathlib import Path
          from urllib.parse import quote

          root = Path("${{ runner.temp }}")
          payload = root / "unpacked" / "Payload"
          apps = sorted(path for path in payload.glob("*.app") if path.is_dir())
          if not apps:
              raise SystemExit("The IPA has no Payload/*.app bundle")
          app = apps[0]
          info_path = app / "Info.plist"
          info = plistlib.loads(info_path.read_bytes())
          executable_name = str(info.get("CFBundleExecutable", ""))
          if not executable_name or "/" in executable_name or "\\" in executable_name:
              raise SystemExit("The IPA has an invalid CFBundleExecutable")
          executable = app / executable_name
          if not executable.is_file():
              raise SystemExit(f"Main executable not found: {executable}")

          if "${{ inputs.plugin_source || 'deb' }}" == "dylib":
              def exact_hex(value):
                  compact = re.sub(r"\s+", "", value)
                  if not compact or len(compact) % 2 or not re.fullmatch(r"[0-9A-Fa-f]+", compact):
                      raise SystemExit("Invalid hexadecimal replacement value")
                  return bytes.fromhex(compact)

              old = exact_hex("""
                  68 74 74 70 73 3A 2F 2F
                  25 73 2F 61 63 63 6F 75
                  6E 74 2F 61 75 74 68 2F
                  6F 61 75 74 68 5F 72 65
                  64 69 72 65 63 74 00 4D
                  6F 7A 69 6C 6C 61 2F 35
                  2E 30 20 28 69 50 68 6F
                  6E 65 3B 20 43 50 55 20
                  69 50 68 6F 6E 65
              """)
              new = exact_hex("""
                  68 74 74 70 73 3A 2F 2F
                  6C 69 76 65 2E 72 61 64
                  69 61 6E 63 65 2E 74 68
                  61 74 67 61 6D 65 63 6F
                  6D 70 61 6E 79 2E 63 6F
                  6D 2F 61 63 63 6F 75 6E
                  74 2F 61 75 74 68 2F 6F
                  61 75 74 68 5F 72 65 64
                  69 72 65 63 74 00
              """)
              if len(old) != 70 or len(new) != 70 or len(old) != len(new):
                  raise SystemExit("Hex replacement must be exactly 70 bytes on both sides")

              original = executable.read_bytes()
              offsets = []
              position = 0
              while True:
                  position = original.find(old, position)
                  if position < 0:
                      break
                  offsets.append(position)
                  position += 1
              if len(offsets) != 1:
                  raise SystemExit(f"Expected one exact 70-byte pattern, found {len(offsets)}")

              offset = offsets[0]
              patched = original[:offset] + new + original[offset + len(old):]
              if len(patched) != len(original):
                  raise SystemExit("Patched executable size changed")
              if patched[:offset] != original[:offset] or patched[offset + len(new):] != original[offset + len(old):]:
                  raise SystemExit("Bytes outside the exact replacement range changed")

              executable.write_bytes(patched)
              verified = executable.read_bytes()
              if (len(verified) != len(original) or
                      verified[offset:offset + len(new)] != new or
                      verified[:offset] != original[:offset] or
                      verified[offset + len(new):] != original[offset + len(old):]):
                  raise SystemExit("Written executable failed exact replacement verification")
              print(f"Replaced one exact 70-byte pattern at file offset 0x{offset:X}; executable size unchanged")

              old_hostname = "live.radiance.thatgamecompany.com"
              new_hostname = "sky.jljlb.vip"
              plist_format = plistlib.FMT_BINARY if info_path.read_bytes().startswith(b"bplist00") else plistlib.FMT_XML
              replacements = 0

              def replace_plist_value(value):
                  global replacements
                  if isinstance(value, str):
                      if value == old_hostname:
                          replacements += 1
                          return new_hostname
                      return value
                  if isinstance(value, dict):
                      return {key: replace_plist_value(item) for key, item in value.items()}
                  if isinstance(value, list):
                      return [replace_plist_value(item) for item in value]
                  return value

              info = replace_plist_value(info)
              if replacements != 1:
                  raise SystemExit(
                      f"Expected one exact Info.plist hostname value, found {replacements}"
                  )
              with info_path.open("wb") as output:
                  plistlib.dump(info, output, fmt=plist_format, sort_keys=False)
              verified_info = plistlib.loads(info_path.read_bytes())

              def count_plist_value(value, expected):
                  if isinstance(value, str):
                      return int(value == expected)
                  if isinstance(value, dict):
                      return sum(count_plist_value(item, expected) for item in value.values())
                  if isinstance(value, list):
                      return sum(count_plist_value(item, expected) for item in value)
                  return 0

              if (count_plist_value(verified_info, old_hostname) != 0 or
                      count_plist_value(verified_info, new_hostname) != 1):
                  raise SystemExit("Info.plist hostname replacement verification failed")
              info = verified_info
              print(
                  "Updated one exact Info.plist hostname value: "
                  f"{old_hostname} -> {new_hostname}; plist format preserved"
              )
          else:
              print(f"Located main executable without hex modification: {executable}")

          bundle_id = str(info.get("CFBundleIdentifier", ""))
          bundle_version = str(info.get("CFBundleVersion", ""))
          access_key = str(info.get("SkyBuildAccessKey", ""))
          title = str(info.get("CFBundleDisplayName") or info.get("CFBundleName") or "Sky")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.-]{0,199}", bundle_id):
              raise SystemExit("The IPA bundle identifier is unsafe for an R2 object name")
          missing = [name for name, value in {
              "CFBundleIdentifier": bundle_id,
              "CFBundleVersion": bundle_version,
              "SkyBuildAccessKey": access_key,
          }.items() if not value]
          if missing:
              raise SystemExit("Missing required Info.plist value(s): " + ", ".join(missing))

          public_base = "${{ env.R2_PUBLIC_BASE }}"
          encoded_name = quote(bundle_id, safe=".-")
          object_base = f"{public_base}/sky/${{ env.R2_SCOPE }}/{encoded_name}"
          metadata = {
              "bundle_id": bundle_id,
              "bundle_version": bundle_version,
              "display_version": str(info.get("CFBundleShortVersionString", "")),
              "sky_build_access_key": access_key,
              "title": title,
              "ipa_url": object_base + ".ipa",
              "plist_url": object_base + ".plist",
              "icon_url": object_base + ".png",
              "main_executable": executable_name,
          }
          (root / "xu-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False), encoding="utf-8"
          )
          (root / "app-dir").write_text(str(app), encoding="utf-8")

          manifest = {
              "items": [{
                  "assets": [
                      {"kind": "software-package", "url": metadata["ipa_url"]},
                      {"kind": "display-image", "url": metadata["icon_url"]},
                      {"kind": "full-size-image", "url": metadata["icon_url"]},
                  ],
                  "metadata": {
                      "bundle-identifier": bundle_id,
                      "bundle-version": bundle_version,
                      "SkyBuildAccessKey": access_key,
                      "kind": "software",
                      "title": title,
                  },
              }],
          }
          asset_prefix = "${{ env.GITHUB_ASSET_PREFIX }}"
          with (Path("${{ github.workspace }}") / f"{asset_prefix}.plist").open("wb") as output:
              plistlib.dump(manifest, output, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

      - name: Inject optional plugin and sign
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          APP_DIR="$(cat "$RUNNER_TEMP/app-dir")"
          INJECT_ARGS=()
          if [[ -s "$RUNNER_TEMP/plugin-path" ]]; then
            PLUGIN_PATH="$(cat "$RUNNER_TEMP/plugin-path")"
            INJECT_ARGS=(-l "$PLUGIN_PATH")
          fi
          rm -rf "$RUNNER_TEMP/zsign-metadata"
          "$HOME/.cache/sky-zsign/zsign" \
            -f \
            -k "$RUNNER_TEMP/cert/signing.p12" \
            -p "$CERT_PASSWORD" \
            -m "$RUNNER_TEMP/cert/signing.mobileprovision" \
            -x "$RUNNER_TEMP/zsign-metadata" \
            "${INJECT_ARGS[@]}" \
            -z 1 \
            -o "$RUNNER_TEMP/Sky-xu-signed.ipa" \
            "$APP_DIR"
          test -s "$RUNNER_TEMP/Sky-xu-signed.ipa"
          ICON_PATH="$(find "$RUNNER_TEMP/zsign-metadata" -type f -iname '*.png' -print -quit)"
          test -n "$ICON_PATH"
          install -m 0644 "$ICON_PATH" "$GITHUB_WORKSPACE/$GITHUB_ASSET_PREFIX.png"
          test -s "$GITHUB_WORKSPACE/$GITHUB_ASSET_PREFIX.png"
          rm -rf "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/zsign-metadata" "$RUNNER_TEMP/deb"
          rm -f "$RUNNER_TEMP/Sky.ipa" "$RUNNER_TEMP/cert.zip" "$RUNNER_TEMP/Sky.deb" "$RUNNER_TEMP/Sky.dylib"
          df -h /

      - name: Multipart upload Xu IPA and install assets to R2
        env:
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SKY_UPLOAD_TOKEN"
          AUTH_HEADER="Authorization: Bearer $SKY_UPLOAD_TOKEN"
          BUNDLE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["bundle_id"])' "$RUNNER_TEMP/xu-metadata.json")"
          OBJECT_NAME="$BUNDLE_ID.ipa"
          ENCODED_OBJECT_NAME="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$OBJECT_NAME")"
          CREATE_RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X POST -H "$AUTH_HEADER" \
            "$UPLOAD_API/create?scope=$R2_SCOPE&name=$ENCODED_OBJECT_NAME")"
          UPLOAD_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_id"])' <<<"$CREATE_RESPONSE")"
          test -n "$UPLOAD_ID"
          export UPLOAD_ID OBJECT_NAME R2_SCOPE
          printf '%s\n%s\n' "$UPLOAD_ID" "$OBJECT_NAME" > "$RUNNER_TEMP/xu-upload-id"
          abort_upload() {
            curl --silent --show-error --retry 3 --retry-all-errors \
              -X POST -H "$AUTH_HEADER" \
              "$UPLOAD_API/abort?scope=$R2_SCOPE&name=$ENCODED_OBJECT_NAME&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")" \
              >/dev/null || true
          }
          trap abort_upload ERR INT TERM

          : > "$RUNNER_TEMP/xu-parts.jsonl"
          PART_SIZE=$((64 * 1024 * 1024))
          FILE_SIZE="$(stat -c %s "$RUNNER_TEMP/Sky-xu-signed.ipa")"
          PART_COUNT=$(((FILE_SIZE + PART_SIZE - 1) / PART_SIZE))
          for PART_NUMBER in $(seq 1 "$PART_COUNT"); do
            dd if="$RUNNER_TEMP/Sky-xu-signed.ipa" \
              of="$RUNNER_TEMP/xu-part.bin" \
              bs="$PART_SIZE" skip=$((PART_NUMBER - 1)) count=1 status=none
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/octet-stream" \
              --data-binary @"$RUNNER_TEMP/xu-part.bin" \
              "$UPLOAD_API/part?scope=$R2_SCOPE&name=$ENCODED_OBJECT_NAME&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")&part_number=$PART_NUMBER" \
              >> "$RUNNER_TEMP/xu-parts.jsonl"
            printf '\n' >> "$RUNNER_TEMP/xu-parts.jsonl"
          done
          rm -f "$RUNNER_TEMP/xu-part.bin"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("${{ runner.temp }}")
          parts = [json.loads(line) for line in (root / "xu-parts.jsonl").read_text().splitlines() if line]
          payload = {
              "upload_id": os.environ["UPLOAD_ID"],
              "name": os.environ["OBJECT_NAME"],
              "scope": os.environ["R2_SCOPE"],
              "parts": parts,
          }
          (root / "xu-complete.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/xu-complete.json" "$UPLOAD_API/complete"
          rm -f "$RUNNER_TEMP/xu-upload-id"
          trap - ERR INT TERM

          PLIST_NAME="$BUNDLE_ID.plist"
          ICON_NAME="$BUNDLE_ID.png"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/xml" \
            --data-binary @"$GITHUB_WORKSPACE/$GITHUB_ASSET_PREFIX.plist" \
            "$UPLOAD_API/object?scope=$R2_SCOPE&name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$PLIST_NAME")"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X PUT -H "$AUTH_HEADER" -H "Content-Type: image/png" \
            --data-binary @"$GITHUB_WORKSPACE/$GITHUB_ASSET_PREFIX.png" \
            "$UPLOAD_API/object?scope=$R2_SCOPE&name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$ICON_NAME")"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/xu-metadata.json" \
            "$UPLOAD_API/metadata?scope=$R2_SCOPE"

      - name: Cleanup unfinished Xu multipart upload
        if: ${{ always() }}
        env:
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          ID_FILE="$RUNNER_TEMP/xu-upload-id"
          if [[ ! -s "$ID_FILE" ]]; then
            exit 0
          fi
          UPLOAD_ID="$(sed -n '1p' "$ID_FILE")"
          OBJECT_NAME="$(sed -n '2p' "$ID_FILE")"
          curl --silent --show-error --retry 3 --retry-all-errors \
            -X POST -H "Authorization: Bearer $SKY_UPLOAD_TOKEN" \
            "$UPLOAD_API/abort?scope=$R2_SCOPE&name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$OBJECT_NAME")&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")" \
            >/dev/null || true
          rm -f "$ID_FILE"

      - name: Verify public Xu IPA plist and icon
        run: |
          set -euo pipefail
          IPA_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["ipa_url"])' "$RUNNER_TEMP/xu-metadata.json")"
          PLIST_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["plist_url"])' "$RUNNER_TEMP/xu-metadata.json")"
          ICON_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["icon_url"])' "$RUNNER_TEMP/xu-metadata.json")"
          EXPECTED_SIZE="$(stat -c %s "$RUNNER_TEMP/Sky-xu-signed.ipa")"
          ACTUAL_SIZE="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --head "$IPA_URL" | tr -d '\r' | awk 'tolower($1) == "content-length:" {print $2}' | tail -1)"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$PLIST_URL" -o "$RUNNER_TEMP/r2-xu.plist"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$ICON_URL" -o "$RUNNER_TEMP/r2-xu-icon.png"
          cmp "$GITHUB_WORKSPACE/$GITHUB_ASSET_PREFIX.plist" "$RUNNER_TEMP/r2-xu.plist"
          cmp "$GITHUB_WORKSPACE/$GITHUB_ASSET_PREFIX.png" "$RUNNER_TEMP/r2-xu-icon.png"
          echo "Published $ACTUAL_SIZE bytes to $IPA_URL"
          echo "Published Xu install manifest to $PLIST_URL"
          echo "Published Xu app icon to $ICON_URL"

      - name: Create or update installation assets on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$GITHUB_ASSET_PREFIX.plist" "$GITHUB_ASSET_PREFIX.png"
          if git diff --cached --quiet; then
            echo "$GITHUB_ASSET_PREFIX.plist and $GITHUB_ASSET_PREFIX.png are already current"
            exit 0
          fi
          git commit -m "Update $GITHUB_ASSET_PREFIX installation manifest and icon"
          git pull --rebase origin main
          git push origin HEAD:main

  restore_beta:
    if: inputs.operation == 'restore-beta'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_URL: https://koyeb.idkwhn.ccwu.cc/yan/ios.ipa
      UPLOAD_API: https://app.idkwhn.ccwu.cc/api/sky-upload
      OBJECT_NAME: com.tgc.sky.test.gold.ipa
      EXPECTED_BUNDLE_ID: com.tgc.sky.test.gold
    steps:
      - name: Download and validate Sky Beta source IPA
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          curl --fail --location --silent --show-error --retry 8 --retry-all-errors \
            "$SOURCE_URL" -o "$RUNNER_TEMP/beta-source.ipa"
          test "$(stat -c %s "$RUNNER_TEMP/beta-source.ipa")" -gt 1073741824
          python3 - <<'PY'
          import os
          import plistlib
          import re
          import zipfile
          from pathlib import Path

          ipa = Path(os.environ["RUNNER_TEMP"]) / "beta-source.ipa"
          with zipfile.ZipFile(ipa) as archive:
              matches = [name for name in archive.namelist()
                         if re.fullmatch(r"Payload/[^/]+[.]app/Info[.]plist", name)]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one main Info.plist, found {len(matches)}")
              info = plistlib.loads(archive.read(matches[0]))
          actual = str(info.get("CFBundleIdentifier", ""))
          expected = os.environ["EXPECTED_BUNDLE_ID"]
          if actual != expected:
              raise SystemExit(f"Unexpected bundle ID: {actual!r}, expected {expected!r}")
          print(f"Validated {actual} build {info.get('CFBundleVersion', '')}")
          PY

      - name: Restore source IPA to R2 atomically
        env:
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SKY_UPLOAD_TOKEN"
          AUTH_HEADER="Authorization: Bearer $SKY_UPLOAD_TOKEN"
          ENCODED_NAME="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["OBJECT_NAME"]))')"
          CREATE_RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X POST -H "$AUTH_HEADER" "$UPLOAD_API/create?name=$ENCODED_NAME")"
          UPLOAD_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_id"])' <<<"$CREATE_RESPONSE")"
          test -n "$UPLOAD_ID"
          printf '%s\n%s\n' "$UPLOAD_ID" "$OBJECT_NAME" > "$RUNNER_TEMP/restore-upload-id"
          abort_upload() {
            curl --silent --show-error --retry 3 --retry-all-errors -X POST -H "$AUTH_HEADER" \
              "$UPLOAD_API/abort?name=$ENCODED_NAME&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")" \
              >/dev/null || true
          }
          trap abort_upload ERR INT TERM
          : > "$RUNNER_TEMP/restore-parts.jsonl"
          PART_SIZE=$((64 * 1024 * 1024))
          FILE_SIZE="$(stat -c %s "$RUNNER_TEMP/beta-source.ipa")"
          PART_COUNT=$(((FILE_SIZE + PART_SIZE - 1) / PART_SIZE))
          for PART_NUMBER in $(seq 1 "$PART_COUNT"); do
            dd if="$RUNNER_TEMP/beta-source.ipa" of="$RUNNER_TEMP/restore-part.bin" \
              bs="$PART_SIZE" skip=$((PART_NUMBER - 1)) count=1 status=none
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/octet-stream" \
              --data-binary @"$RUNNER_TEMP/restore-part.bin" \
              "$UPLOAD_API/part?name=$ENCODED_NAME&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")&part_number=$PART_NUMBER" \
              >> "$RUNNER_TEMP/restore-parts.jsonl"
            printf '\n' >> "$RUNNER_TEMP/restore-parts.jsonl"
          done
          rm -f "$RUNNER_TEMP/restore-part.bin"
          export UPLOAD_ID OBJECT_NAME
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          parts = [json.loads(line) for line in (root / "restore-parts.jsonl").read_text().splitlines() if line]
          payload = {"upload_id": os.environ["UPLOAD_ID"], "name": os.environ["OBJECT_NAME"], "scope": "", "parts": parts}
          (root / "restore-complete.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/restore-complete.json" "$UPLOAD_API/complete"
          rm -f "$RUNNER_TEMP/restore-upload-id"
          trap - ERR INT TERM

      - name: Cleanup unfinished source multipart upload
        if: ${{ always() }}
        env:
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          ID_FILE="$RUNNER_TEMP/restore-upload-id"
          if [[ ! -s "$ID_FILE" ]]; then exit 0; fi
          UPLOAD_ID="$(sed -n '1p' "$ID_FILE")"
          NAME="$(sed -n '2p' "$ID_FILE")"
          curl --silent --show-error --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer $SKY_UPLOAD_TOKEN" \
            "$UPLOAD_API/abort?name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$NAME")&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")" \
            >/dev/null || true
          rm -f "$ID_FILE"

  cleanup:
    if: inputs.operation == 'cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Abort exact incomplete multipart upload
        env:
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
          SCOPE: ${{ inputs.cleanup_scope }}
          OBJECT_NAME: ${{ inputs.cleanup_name }}
          UPLOAD_ID: ${{ inputs.cleanup_upload_id }}
        run: |
          set -euo pipefail
          test -n "$SKY_UPLOAD_TOKEN"
          if [[ "$SCOPE" == "all" ]]; then
            RESPONSE="$(curl --fail-with-body --silent --show-error --request POST \
              -H "Authorization: Bearer $SKY_UPLOAD_TOKEN" \
              "https://app.idkwhn.ccwu.cc/api/sky-upload/cleanup-all?minimum_age_seconds=900")"
            python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("success"); print(json.dumps(data, ensure_ascii=False))' \
              <<<"$RESPONSE"
            exit 0
          fi
          test -n "$OBJECT_NAME"
          test -n "$UPLOAD_ID"
          QUERY="$(python3 - <<'PY'
          import os
          from urllib.parse import urlencode
          print(urlencode({
              "scope": "" if os.environ["SCOPE"] == "root" else os.environ["SCOPE"],
              "name": os.environ["OBJECT_NAME"],
              "upload_id": os.environ["UPLOAD_ID"],
          }))
          PY
          )"
          RESPONSE="$(curl --fail-with-body --silent --show-error --request POST \
            -H "Authorization: Bearer $SKY_UPLOAD_TOKEN" \
            "https://app.idkwhn.ccwu.cc/api/sky-upload/abort?$QUERY")"
          python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("success") and data.get("aborted")' \
            <<<"$RESPONSE"
          echo "Incomplete multipart upload aborted."
