name: Update NetEase Sky Android key status

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: apkeep-com.tgc.sky.android
      cancel-in-progress: false
    steps:
      - name: Check out Pages source
        uses: actions/checkout@v4

      - name: Read NetEase APK and update status
        shell: bash
        run: python3 scripts/update-netease-sky-status.py --status-file bese/com.tgc.sky.android/status.json

      - name: Commit status changes
        id: commit_status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bese/com.tgc.sky.android/status.json
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if ! git diff --cached --quiet; then
            git commit -m "Update NetEase Sky APK version and key"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "NetEase Sky status is unchanged."
          fi

      - name: Deploy updated status page
        if: steps.commit_status.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
