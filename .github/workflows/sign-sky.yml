name: Sign Sky Beta IPA

run-name: Sky Beta ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique signing request ID
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sign-sky-beta-ipa
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      SOURCE_IPA_URL: https://pub-6f7ffe944e2948a19530df1f8bd6fc9f.r2.dev/sky/com.tgc.sky.test.gold.ipa
      UPLOAD_API: https://app.idkwhn.ccwu.cc/api/sky-upload
      R2_PUBLIC_BASE: https://pub-6f7ffe944e2948a19530df1f8bd6fc9f.r2.dev
      R2_SCOPE: Beta

    steps:
      - name: Checkout main for ios.plist
        uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: ios.plist
          sparse-checkout-cone-mode: false

      - name: Free disk space for the large IPA
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /

      - name: Restore zsign cache
        id: zsign-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sky-zsign/zsign
          key: sky-zsign-${{ runner.os }}-e803f870dc686e6161d00d9b22c425b8acdfacee

      - name: Build zsign
        if: steps.zsign-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make pkg-config libssl-dev
          git clone --filter=blob:none https://github.com/zhlynn/zsign.git "$RUNNER_TEMP/zsign-src"
          git -C "$RUNNER_TEMP/zsign-src" checkout --detach e803f870dc686e6161d00d9b22c425b8acdfacee
          make -C "$RUNNER_TEMP/zsign-src/build/linux" -j"$(nproc)"
          mkdir -p "$HOME/.cache/sky-zsign"
          install -m 0755 "$RUNNER_TEMP/zsign-src/bin/zsign" "$HOME/.cache/sky-zsign/zsign"

      - name: Download IPA and certificate
        env:
          CERT_ZIP_URL: ${{ secrets.CERT_ZIP_URL }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERT_ZIP_URL"
          test -n "$CERT_PASSWORD"
          SOURCE_REQUEST_URL="${SOURCE_IPA_URL}?signing_run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --location --retry 5 --retry-all-errors --continue-at - \
            -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
            "$SOURCE_REQUEST_URL" -o "$RUNNER_TEMP/Sky_Beta.ipa"
          curl --fail --location --retry 5 --retry-all-errors \
            "$CERT_ZIP_URL" -o "$RUNNER_TEMP/cert.zip"
          test -s "$RUNNER_TEMP/Sky_Beta.ipa"
          mkdir -p "$RUNNER_TEMP/cert"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("${{ runner.temp }}")
          wanted = {".p12": "signing.p12", ".mobileprovision": "signing.mobileprovision"}
          with ZipFile(root / "cert.zip") as archive:
              for item in archive.infolist():
                  suffix = Path(item.filename).suffix.lower()
                  target = root / "cert" / wanted.get(suffix, "")
                  if suffix in wanted and not target.exists():
                      target.write_bytes(archive.read(item))
          for filename in wanted.values():
              path = root / "cert" / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing {filename} in certificate zip")
          PY
          df -h /

      - name: Patch OAuth URL, read app metadata, and sign
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import plistlib
          import re
          import struct
          import zlib
          from pathlib import Path
          from urllib.parse import quote
          from zipfile import ZipFile

          root = Path("${{ runner.temp }}")

          def png_chunk(chunk_type, payload):
              body = chunk_type + payload
              return struct.pack(">I", len(payload)) + body + struct.pack(">I", zlib.crc32(body))

          def paeth(left, up, upper_left):
              estimate = left + up - upper_left
              left_distance = abs(estimate - left)
              up_distance = abs(estimate - up)
              upper_left_distance = abs(estimate - upper_left)
              if left_distance <= up_distance and left_distance <= upper_left_distance:
                  return left
              if up_distance <= upper_left_distance:
                  return up
              return upper_left

          def convert_cgbi_png(source):
              signature = b"\x89PNG\r\n\x1a\n"
              if not source.startswith(signature):
                  raise SystemExit("The extracted app icon is not a PNG")
              chunks = []
              position = len(signature)
              while position + 12 <= len(source):
                  length = struct.unpack(">I", source[position:position + 4])[0]
                  chunk_type = source[position + 4:position + 8]
                  payload = source[position + 8:position + 8 + length]
                  chunks.append((chunk_type, payload))
                  position += 12 + length
                  if chunk_type == b"IEND":
                      break
              if not any(chunk_type == b"CgBI" for chunk_type, _ in chunks):
                  return source
              ihdr = next(payload for chunk_type, payload in chunks if chunk_type == b"IHDR")
              width, height, bit_depth, color_type, compression, filtering, interlace = struct.unpack(
                  ">IIBBBBB", ihdr
              )
              if (bit_depth, color_type, compression, filtering, interlace) != (8, 6, 0, 0, 0):
                  raise SystemExit("Unsupported CgBI app icon format")
              compressed = b"".join(payload for chunk_type, payload in chunks if chunk_type == b"IDAT")
              filtered = zlib.decompress(compressed, -15)
              stride = width * 4
              if len(filtered) != height * (stride + 1):
                  raise SystemExit("Invalid CgBI app icon scanline data")
              previous = bytearray(stride)
              output = bytearray()
              offset = 0
              for _ in range(height):
                  filter_type = filtered[offset]
                  source_row = filtered[offset + 1:offset + 1 + stride]
                  offset += stride + 1
                  row = bytearray(stride)
                  for index, value in enumerate(source_row):
                      left = row[index - 4] if index >= 4 else 0
                      up = previous[index]
                      upper_left = previous[index - 4] if index >= 4 else 0
                      if filter_type == 0:
                          restored = value
                      elif filter_type == 1:
                          restored = value + left
                      elif filter_type == 2:
                          restored = value + up
                      elif filter_type == 3:
                          restored = value + ((left + up) // 2)
                      elif filter_type == 4:
                          restored = value + paeth(left, up, upper_left)
                      else:
                          raise SystemExit("Unsupported PNG filter in CgBI app icon")
                      row[index] = restored & 255
                  output.append(0)
                  for index in range(0, stride, 4):
                      blue, green, red, alpha = row[index:index + 4]
                      if alpha:
                          red = min(255, (red * 255 + alpha // 2) // alpha)
                          green = min(255, (green * 255 + alpha // 2) // alpha)
                          blue = min(255, (blue * 255 + alpha // 2) // alpha)
                      else:
                          red = green = blue = 0
                      output.extend((red, green, blue, alpha))
                  previous = row
              return (
                  signature
                  + png_chunk(b"IHDR", ihdr)
                  + png_chunk(b"IDAT", zlib.compress(bytes(output), 9))
                  + png_chunk(b"IEND", b"")
              )

          with ZipFile(root / "Sky_Beta.ipa") as archive:
              candidates = [
                  name for name in archive.namelist()
                  if name.startswith("Payload/")
                  and name.count("/") == 2
                  and name.endswith(".app/Info.plist")
              ]
              if not candidates:
                  raise SystemExit("The IPA has no Payload/*.app/Info.plist")
              info_path = candidates[0]
              app_root = info_path.rsplit("/", 1)[0] + "/"
              info = plistlib.loads(archive.read(info_path))

              icon_names = []
              primary_icon = info.get("CFBundleIcons", {}).get("CFBundlePrimaryIcon", {})
              icon_names.extend(primary_icon.get("CFBundleIconFiles", []))
              icon_names.extend(info.get("CFBundleIconFiles", []))
              icon_candidates = [
                  name for name in archive.namelist()
                  if name.startswith(app_root)
                  and "/" not in name[len(app_root):]
                  and name.lower().endswith(".png")
                  and (
                      any(Path(name).stem.startswith(icon) for icon in icon_names)
                      or "icon" in Path(name).name.lower()
                  )
              ]
              if not icon_candidates:
                  raise SystemExit("The IPA has no extractable app icon PNG")

              def icon_score(name):
                  lower = Path(name).name.lower()
                  return (
                      (300 if "@3x" in lower else 200 if "@2x" in lower else 0)
                      + (100 if "60x60" in lower else 0)
                      + min(archive.getinfo(name).file_size, 99999) / 100000
                  )

              icon_path = max(icon_candidates, key=icon_score)
              (root / "sky-icon.png").write_bytes(convert_cgbi_png(archive.read(icon_path)))
          bundle_id = str(info.get("CFBundleIdentifier", ""))
          bundle_version = str(info.get("CFBundleVersion", ""))
          access_key = str(info.get("SkyBuildAccessKey", ""))
          title = str(info.get("CFBundleDisplayName") or info.get("CFBundleName") or "Sky Beta")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.-]{0,199}", bundle_id):
              raise SystemExit("The IPA bundle identifier is unsafe for an R2 object name")
          public_base = "${{ env.R2_PUBLIC_BASE }}"
          encoded_name = quote(bundle_id, safe=".-")
          object_base = f"{public_base}/sky/${{ env.R2_SCOPE }}/{encoded_name}"
          ipa_url = object_base + ".ipa"
          plist_url = object_base + ".plist"
          icon_url = object_base + ".png"
          metadata = {
              "bundle_id": bundle_id,
              "bundle_version": bundle_version,
              "display_version": str(info.get("CFBundleShortVersionString", "")),
              "sky_build_access_key": access_key,
              "title": title,
              "ipa_url": ipa_url,
              "plist_url": plist_url,
              "icon_url": icon_url,
          }
          missing = [name for name, value in {
              "CFBundleIdentifier": bundle_id,
              "CFBundleVersion": bundle_version,
              "SkyBuildAccessKey": access_key,
          }.items() if not value]
          if missing:
              raise SystemExit("Missing required Info.plist value(s): " + ", ".join(missing))
          (root / "sky-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False), encoding="utf-8"
          )

          manifest = {
              "items": [{
                  "assets": [
                      {"kind": "software-package", "url": ipa_url},
                      {"kind": "display-image", "url": icon_url},
                      {"kind": "full-size-image", "url": icon_url},
                  ],
                  "metadata": {
                      "bundle-identifier": bundle_id,
                      "bundle-version": bundle_version,
                      "SkyBuildAccessKey": access_key,
                      "kind": "software",
                      "title": title,
                  },
              }],
          }
          with (Path("${{ github.workspace }}") / "ios.plist").open("wb") as output:
              plistlib.dump(manifest, output, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          test -s "$RUNNER_TEMP/sky-icon.png"
          rm -rf "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/Sky_Beta.ipa" -d "$RUNNER_TEMP/unpacked"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          root = Path("${{ runner.temp }}")
          payload = root / "unpacked" / "Payload"
          apps = sorted(path for path in payload.glob("*.app") if path.is_dir())
          if not apps:
              raise SystemExit("The IPA has no Payload/*.app bundle")
          app = apps[0]
          info = plistlib.loads((app / "Info.plist").read_bytes())
          executable_name = str(info.get("CFBundleExecutable", ""))
          if not executable_name or "/" in executable_name or "\\" in executable_name:
              raise SystemExit("The IPA has an invalid CFBundleExecutable")
          executable = app / executable_name
          if not executable.is_file():
              raise SystemExit(f"Main executable not found: {executable}")

          old = bytes.fromhex(
              "68 74 74 70 73 3A 2F 2F 25 73 2F 61 63 63 6F 75 "
              "6E 74 2F 61 75 74 68 2F 6F 61 75 74 68 5F 72 65 "
              "64 69 72 65 63 74 00 4D 6F 7A 69 6C 6C 61 2F 35 "
              "2E 30 20 28 69 50 68 6F 6E 65 3B 20 43 50 55 20 "
              "69 50 68 6F 6E 65"
          )
          new = bytes.fromhex(
              "68 74 74 70 73 3A 2F 2F 6C 69 76 65 2E 72 61 64 "
              "69 61 6E 63 65 2E 74 68 61 74 67 61 6D 65 63 6F "
              "6D 70 61 6E 79 2E 63 6F 6D 2F 61 63 63 6F 75 6E "
              "74 2F 61 75 74 68 2F 6F 61 75 74 68 5F 72 65 64 "
              "69 72 65 63 74 00"
          )
          if len(old) != len(new):
              raise SystemExit("OAuth URL replacement must preserve the executable size")
          data = executable.read_bytes()
          matches = data.count(old)
          if matches != 1:
              raise SystemExit(f"Expected exactly one OAuth URL pattern, found {matches}")
          patched = data.replace(old, new)
          if old in patched or patched.count(new) < 1:
              raise SystemExit("OAuth URL patch verification failed")
          executable.write_bytes(patched)
          (root / "app-dir").write_text(str(app), encoding="utf-8")
          print(f"Patched one OAuth URL occurrence in {executable}")
          PY
          APP_DIR="$(cat "$RUNNER_TEMP/app-dir")"
          "$HOME/.cache/sky-zsign/zsign" \
            -f \
            -k "$RUNNER_TEMP/cert/signing.p12" \
            -p "$CERT_PASSWORD" \
            -m "$RUNNER_TEMP/cert/signing.mobileprovision" \
            -z 1 \
            -o "$RUNNER_TEMP/Sky_Beta-signed.ipa" \
            "$APP_DIR"
          test -s "$RUNNER_TEMP/Sky_Beta-signed.ipa"
          rm -rf "$RUNNER_TEMP/unpacked"
          rm -f "$RUNNER_TEMP/Sky_Beta.ipa" "$RUNNER_TEMP/cert.zip"
          df -h /

      - name: Multipart upload signed IPA to R2
        env:
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SKY_UPLOAD_TOKEN"
          AUTH_HEADER="Authorization: Bearer $SKY_UPLOAD_TOKEN"
          BUNDLE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["bundle_id"])' "$RUNNER_TEMP/sky-metadata.json")"
          OBJECT_NAME="$BUNDLE_ID.ipa"
          ENCODED_OBJECT_NAME="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$OBJECT_NAME")"
          CREATE_RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X POST -H "$AUTH_HEADER" "$UPLOAD_API/create?scope=$R2_SCOPE&name=$ENCODED_OBJECT_NAME")"
          UPLOAD_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_id"])' <<<"$CREATE_RESPONSE")"
          test -n "$UPLOAD_ID"
          export UPLOAD_ID OBJECT_NAME R2_SCOPE
          printf '%s\n%s\n' "$UPLOAD_ID" "$OBJECT_NAME" > "$RUNNER_TEMP/sky-upload-id"
          abort_upload() {
            curl --silent --show-error --retry 3 --retry-all-errors \
              -X POST -H "$AUTH_HEADER" \
              "$UPLOAD_API/abort?scope=$R2_SCOPE&name=$ENCODED_OBJECT_NAME&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")" \
              >/dev/null || true
          }
          trap abort_upload ERR INT TERM

          : > "$RUNNER_TEMP/sky-parts.jsonl"
          PART_SIZE=$((64 * 1024 * 1024))
          FILE_SIZE="$(stat -c %s "$RUNNER_TEMP/Sky_Beta-signed.ipa")"
          PART_COUNT=$(((FILE_SIZE + PART_SIZE - 1) / PART_SIZE))
          for PART_NUMBER in $(seq 1 "$PART_COUNT"); do
            dd if="$RUNNER_TEMP/Sky_Beta-signed.ipa" \
              of="$RUNNER_TEMP/sky-part.bin" \
              bs="$PART_SIZE" skip=$((PART_NUMBER - 1)) count=1 status=none
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/octet-stream" \
              --data-binary @"$RUNNER_TEMP/sky-part.bin" \
              "$UPLOAD_API/part?scope=$R2_SCOPE&name=$ENCODED_OBJECT_NAME&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")&part_number=$PART_NUMBER" \
              >> "$RUNNER_TEMP/sky-parts.jsonl"
            printf '\n' >> "$RUNNER_TEMP/sky-parts.jsonl"
          done
          rm -f "$RUNNER_TEMP/sky-part.bin"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("${{ runner.temp }}")
          parts = [json.loads(line) for line in (root / "sky-parts.jsonl").read_text().splitlines() if line]
          payload = {
              "upload_id": os.environ["UPLOAD_ID"],
              "name": os.environ["OBJECT_NAME"],
              "scope": os.environ["R2_SCOPE"],
              "parts": parts,
          }
          (root / "sky-complete.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/sky-complete.json" "$UPLOAD_API/complete"
          rm -f "$RUNNER_TEMP/sky-upload-id"
          trap - ERR INT TERM
          PLIST_NAME="$BUNDLE_ID.plist"
          ICON_NAME="$BUNDLE_ID.png"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/xml" \
            --data-binary @"$GITHUB_WORKSPACE/ios.plist" \
            "$UPLOAD_API/object?scope=$R2_SCOPE&name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$PLIST_NAME")"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X PUT -H "$AUTH_HEADER" -H "Content-Type: image/png" \
            --data-binary @"$RUNNER_TEMP/sky-icon.png" \
            "$UPLOAD_API/object?scope=$R2_SCOPE&name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$ICON_NAME")"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/sky-metadata.json" "$UPLOAD_API/metadata?scope=$R2_SCOPE"

      - name: Cleanup unfinished multipart upload
        if: ${{ always() }}
        env:
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          ID_FILE="$RUNNER_TEMP/sky-upload-id"
          if [[ ! -s "$ID_FILE" ]]; then
            exit 0
          fi
          UPLOAD_ID="$(sed -n '1p' "$ID_FILE")"
          OBJECT_NAME="$(sed -n '2p' "$ID_FILE")"
          curl --silent --show-error --retry 3 --retry-all-errors \
            -X POST -H "Authorization: Bearer $SKY_UPLOAD_TOKEN" \
              "$UPLOAD_API/abort?scope=$R2_SCOPE&name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$OBJECT_NAME")&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")" \
            >/dev/null || true
          rm -f "$ID_FILE"

      - name: Verify public signed IPA
        run: |
          set -euo pipefail
          SIGNED_IPA_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["ipa_url"])' "$RUNNER_TEMP/sky-metadata.json")"
          PLIST_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["plist_url"])' "$RUNNER_TEMP/sky-metadata.json")"
          ICON_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["icon_url"])' "$RUNNER_TEMP/sky-metadata.json")"
          EXPECTED_SIZE="$(stat -c %s "$RUNNER_TEMP/Sky_Beta-signed.ipa")"
          ACTUAL_SIZE="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --head "$SIGNED_IPA_URL" | tr -d '\r' | awk 'tolower($1) == "content-length:" {print $2}' | tail -1)"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$PLIST_URL" -o "$RUNNER_TEMP/r2-install.plist"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$ICON_URL" -o "$RUNNER_TEMP/r2-icon.png"
          cmp "$GITHUB_WORKSPACE/ios.plist" "$RUNNER_TEMP/r2-install.plist"
          cmp "$RUNNER_TEMP/sky-icon.png" "$RUNNER_TEMP/r2-icon.png"
          echo "Published $ACTUAL_SIZE bytes to $SIGNED_IPA_URL"
          echo "Published install manifest to $PLIST_URL"
          echo "Published app icon to $ICON_URL"

      - name: Replace ios.plist on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ios.plist
          if git diff --cached --quiet; then
            echo "ios.plist is already current"
            exit 0
          fi
          git commit -m "Update Sky Beta installation manifest"
          git pull --rebase origin main
          git push origin HEAD:main
