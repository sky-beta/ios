name: Sign Sky Beta IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-sky-beta-ipa
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      SOURCE_IPA_URL: https://pub-6f7ffe944e2948a19530df1f8bd6fc9f.r2.dev/sky/Sky_Beta.ipa
      UPLOAD_API: https://app.idkwhn.ccwu.cc/api/sky-upload
      R2_PUBLIC_BASE: https://pub-6f7ffe944e2948a19530df1f8bd6fc9f.r2.dev

    steps:
      - name: Checkout main for ios.plist
        uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: ios.plist
          sparse-checkout-cone-mode: false

      - name: Free disk space for the large IPA
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pngcrush
          df -h /

      - name: Restore zsign cache
        id: zsign-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sky-zsign/zsign
          key: sky-zsign-${{ runner.os }}-e803f870dc686e6161d00d9b22c425b8acdfacee

      - name: Build zsign
        if: steps.zsign-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends g++ make pkg-config libssl-dev
          git clone --filter=blob:none https://github.com/zhlynn/zsign.git "$RUNNER_TEMP/zsign-src"
          git -C "$RUNNER_TEMP/zsign-src" checkout --detach e803f870dc686e6161d00d9b22c425b8acdfacee
          make -C "$RUNNER_TEMP/zsign-src/build/linux" -j"$(nproc)"
          mkdir -p "$HOME/.cache/sky-zsign"
          install -m 0755 "$RUNNER_TEMP/zsign-src/bin/zsign" "$HOME/.cache/sky-zsign/zsign"

      - name: Download IPA and certificate
        env:
          CERT_ZIP_URL: ${{ secrets.CERT_ZIP_URL }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERT_ZIP_URL"
          test -n "$CERT_PASSWORD"
          curl --fail --location --retry 5 --retry-all-errors --continue-at - \
            "$SOURCE_IPA_URL" -o "$RUNNER_TEMP/Sky_Beta.ipa"
          curl --fail --location --retry 5 --retry-all-errors \
            "$CERT_ZIP_URL" -o "$RUNNER_TEMP/cert.zip"
          test -s "$RUNNER_TEMP/Sky_Beta.ipa"
          mkdir -p "$RUNNER_TEMP/cert"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("${{ runner.temp }}")
          wanted = {".p12": "signing.p12", ".mobileprovision": "signing.mobileprovision"}
          with ZipFile(root / "cert.zip") as archive:
              for item in archive.infolist():
                  suffix = Path(item.filename).suffix.lower()
                  target = root / "cert" / wanted.get(suffix, "")
                  if suffix in wanted and not target.exists():
                      target.write_bytes(archive.read(item))
          for filename in wanted.values():
              path = root / "cert" / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing {filename} in certificate zip")
          PY
          df -h /

      - name: Read app metadata and sign
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import plistlib
          import re
          from pathlib import Path
          from urllib.parse import quote
          from zipfile import ZipFile

          root = Path("${{ runner.temp }}")
          with ZipFile(root / "Sky_Beta.ipa") as archive:
              candidates = [
                  name for name in archive.namelist()
                  if name.startswith("Payload/")
                  and name.count("/") == 2
                  and name.endswith(".app/Info.plist")
              ]
              if not candidates:
                  raise SystemExit("The IPA has no Payload/*.app/Info.plist")
              info_path = candidates[0]
              app_root = info_path.rsplit("/", 1)[0] + "/"
              info = plistlib.loads(archive.read(info_path))

              icon_names = []
              primary_icon = info.get("CFBundleIcons", {}).get("CFBundlePrimaryIcon", {})
              icon_names.extend(primary_icon.get("CFBundleIconFiles", []))
              icon_names.extend(info.get("CFBundleIconFiles", []))
              icon_candidates = [
                  name for name in archive.namelist()
                  if name.startswith(app_root)
                  and "/" not in name[len(app_root):]
                  and name.lower().endswith(".png")
                  and (
                      any(Path(name).stem.startswith(icon) for icon in icon_names)
                      or "icon" in Path(name).name.lower()
                  )
              ]
              if not icon_candidates:
                  raise SystemExit("The IPA has no extractable app icon PNG")

              def icon_score(name):
                  lower = Path(name).name.lower()
                  return (
                      (300 if "@3x" in lower else 200 if "@2x" in lower else 0)
                      + (100 if "60x60" in lower else 0)
                      + min(archive.getinfo(name).file_size, 99999) / 100000
                  )

              icon_path = max(icon_candidates, key=icon_score)
              (root / "sky-icon-cgbi.png").write_bytes(archive.read(icon_path))
          bundle_id = str(info.get("CFBundleIdentifier", ""))
          bundle_version = str(info.get("CFBundleVersion", ""))
          access_key = str(info.get("SkyBuildAccessKey", ""))
          title = str(info.get("CFBundleDisplayName") or info.get("CFBundleName") or "Sky Beta")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.-]{0,199}", bundle_id):
              raise SystemExit("The IPA bundle identifier is unsafe for an R2 object name")
          public_base = "${{ env.R2_PUBLIC_BASE }}"
          encoded_name = quote(bundle_id, safe=".-")
          ipa_url = f"{public_base}/sky/{encoded_name}.ipa"
          plist_url = f"{public_base}/sky/{encoded_name}.plist"
          icon_url = f"{public_base}/sky/{encoded_name}.png"
          metadata = {
              "bundle_id": bundle_id,
              "bundle_version": bundle_version,
              "display_version": str(info.get("CFBundleShortVersionString", "")),
              "sky_build_access_key": access_key,
              "title": title,
              "ipa_url": ipa_url,
              "plist_url": plist_url,
              "icon_url": icon_url,
          }
          missing = [name for name, value in {
              "CFBundleIdentifier": bundle_id,
              "CFBundleVersion": bundle_version,
              "SkyBuildAccessKey": access_key,
          }.items() if not value]
          if missing:
              raise SystemExit("Missing required Info.plist value(s): " + ", ".join(missing))
          (root / "sky-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False), encoding="utf-8"
          )

          manifest = {
              "items": [{
                  "assets": [
                      {"kind": "software-package", "url": ipa_url},
                      {"kind": "display-image", "url": icon_url},
                      {"kind": "full-size-image", "url": icon_url},
                  ],
                  "metadata": {
                      "bundle-identifier": bundle_id,
                      "bundle-version": bundle_version,
                      "SkyBuildAccessKey": access_key,
                      "kind": "software",
                      "title": title,
                  },
              }],
          }
          with (Path("${{ github.workspace }}") / "ios.plist").open("wb") as output:
              plistlib.dump(manifest, output, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          pngcrush -q -revert-iphone-optimizations \
            "$RUNNER_TEMP/sky-icon-cgbi.png" "$RUNNER_TEMP/sky-icon.png"
          test -s "$RUNNER_TEMP/sky-icon.png"
          "$HOME/.cache/sky-zsign/zsign" \
            -f \
            -k "$RUNNER_TEMP/cert/signing.p12" \
            -p "$CERT_PASSWORD" \
            -m "$RUNNER_TEMP/cert/signing.mobileprovision" \
            -z 1 \
            -o "$RUNNER_TEMP/Sky_Beta-signed.ipa" \
            "$RUNNER_TEMP/Sky_Beta.ipa"
          test -s "$RUNNER_TEMP/Sky_Beta-signed.ipa"
          rm -f "$RUNNER_TEMP/Sky_Beta.ipa" "$RUNNER_TEMP/cert.zip"
          df -h /

      - name: Multipart upload signed IPA to R2
        env:
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SKY_UPLOAD_TOKEN"
          AUTH_HEADER="Authorization: Bearer $SKY_UPLOAD_TOKEN"
          BUNDLE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["bundle_id"])' "$RUNNER_TEMP/sky-metadata.json")"
          OBJECT_NAME="$BUNDLE_ID.ipa"
          ENCODED_OBJECT_NAME="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$OBJECT_NAME")"
          CREATE_RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X POST -H "$AUTH_HEADER" "$UPLOAD_API/create?name=$ENCODED_OBJECT_NAME")"
          UPLOAD_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_id"])' <<<"$CREATE_RESPONSE")"
          test -n "$UPLOAD_ID"
          export UPLOAD_ID
          export OBJECT_NAME
          printf '%s\n%s\n' "$UPLOAD_ID" "$OBJECT_NAME" > "$RUNNER_TEMP/sky-upload-id"
          abort_upload() {
            curl --silent --show-error --retry 3 --retry-all-errors \
              -X POST -H "$AUTH_HEADER" \
              "$UPLOAD_API/abort?name=$ENCODED_OBJECT_NAME&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")" \
              >/dev/null || true
          }
          trap abort_upload ERR INT TERM

          : > "$RUNNER_TEMP/sky-parts.jsonl"
          PART_SIZE=$((64 * 1024 * 1024))
          FILE_SIZE="$(stat -c %s "$RUNNER_TEMP/Sky_Beta-signed.ipa")"
          PART_COUNT=$(((FILE_SIZE + PART_SIZE - 1) / PART_SIZE))
          for PART_NUMBER in $(seq 1 "$PART_COUNT"); do
            dd if="$RUNNER_TEMP/Sky_Beta-signed.ipa" \
              of="$RUNNER_TEMP/sky-part.bin" \
              bs="$PART_SIZE" skip=$((PART_NUMBER - 1)) count=1 status=none
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/octet-stream" \
              --data-binary @"$RUNNER_TEMP/sky-part.bin" \
              "$UPLOAD_API/part?name=$ENCODED_OBJECT_NAME&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")&part_number=$PART_NUMBER" \
              >> "$RUNNER_TEMP/sky-parts.jsonl"
            printf '\n' >> "$RUNNER_TEMP/sky-parts.jsonl"
          done
          rm -f "$RUNNER_TEMP/sky-part.bin"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("${{ runner.temp }}")
          parts = [json.loads(line) for line in (root / "sky-parts.jsonl").read_text().splitlines() if line]
          payload = {
              "upload_id": os.environ["UPLOAD_ID"],
              "name": os.environ["OBJECT_NAME"],
              "parts": parts,
          }
          (root / "sky-complete.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/sky-complete.json" "$UPLOAD_API/complete"
          rm -f "$RUNNER_TEMP/sky-upload-id"
          trap - ERR INT TERM
          PLIST_NAME="$BUNDLE_ID.plist"
          ICON_NAME="$BUNDLE_ID.png"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/xml" \
            --data-binary @"$GITHUB_WORKSPACE/ios.plist" \
            "$UPLOAD_API/object?name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$PLIST_NAME")"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X PUT -H "$AUTH_HEADER" -H "Content-Type: image/png" \
            --data-binary @"$RUNNER_TEMP/sky-icon.png" \
            "$UPLOAD_API/object?name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$ICON_NAME")"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/sky-metadata.json" "$UPLOAD_API/metadata"

      - name: Cleanup unfinished multipart upload
        if: ${{ always() }}
        env:
          SKY_UPLOAD_TOKEN: ${{ secrets.SKY_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          ID_FILE="$RUNNER_TEMP/sky-upload-id"
          if [[ ! -s "$ID_FILE" ]]; then
            exit 0
          fi
          UPLOAD_ID="$(sed -n '1p' "$ID_FILE")"
          OBJECT_NAME="$(sed -n '2p' "$ID_FILE")"
          curl --silent --show-error --retry 3 --retry-all-errors \
            -X POST -H "Authorization: Bearer $SKY_UPLOAD_TOKEN" \
            "$UPLOAD_API/abort?name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$OBJECT_NAME")&upload_id=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$UPLOAD_ID")" \
            >/dev/null || true
          rm -f "$ID_FILE"

      - name: Verify public signed IPA
        run: |
          set -euo pipefail
          SIGNED_IPA_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["ipa_url"])' "$RUNNER_TEMP/sky-metadata.json")"
          PLIST_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["plist_url"])' "$RUNNER_TEMP/sky-metadata.json")"
          ICON_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["icon_url"])' "$RUNNER_TEMP/sky-metadata.json")"
          EXPECTED_SIZE="$(stat -c %s "$RUNNER_TEMP/Sky_Beta-signed.ipa")"
          ACTUAL_SIZE="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --head "$SIGNED_IPA_URL" | tr -d '\r' | awk 'tolower($1) == "content-length:" {print $2}' | tail -1)"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$PLIST_URL" -o "$RUNNER_TEMP/r2-install.plist"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$ICON_URL" -o "$RUNNER_TEMP/r2-icon.png"
          cmp "$GITHUB_WORKSPACE/ios.plist" "$RUNNER_TEMP/r2-install.plist"
          cmp "$RUNNER_TEMP/sky-icon.png" "$RUNNER_TEMP/r2-icon.png"
          echo "Published $ACTUAL_SIZE bytes to $SIGNED_IPA_URL"
          echo "Published install manifest to $PLIST_URL"
          echo "Published app icon to $ICON_URL"

      - name: Replace ios.plist on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ios.plist
          if git diff --cached --quiet; then
            echo "ios.plist is already current"
            exit 0
          fi
          git commit -m "Update Sky Beta installation manifest"
          git pull --rebase origin main
          git push origin HEAD:main
